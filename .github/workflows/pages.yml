# Deploy the static gallery in docs/ to GitHub Pages.
# After merge, set Settings → Pages → Source to "GitHub Actions" once
# (or confirm it if already selected). Site URL:
# https://kearney-evan-mi.github.io/imagine-gallery/

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "characters/green-eyed-woman/character-bible.md"
      - "characters/green-eyed-woman/prompts/kneeling-arms-outstretched.md"
      - "characters/new-forest-spunk/character-bible.md"
      - "characters/new-forest-spunk/versions/v1.0.0.md"
      - "sessions/2026-08-01-green-eyed-woman.md"
      - "sessions/2026-09-11-enable-github-pages.md"
      - "sessions/2026-09-11-grok-post-ff0116d1.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
