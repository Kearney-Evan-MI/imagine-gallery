name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve grok input tests
        run: python3 scripts/test_resolve_grok_input.py

      - name: Catalog stays in sync
        run: |
          python3 scripts/resolve_grok_input.py --write-catalog
          git diff --exit-code -- docs/grok.json
